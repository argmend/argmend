[workspace]
members = ["."]
exclude = ["fuzz"]

[package]
name = "argmend"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Argmend repairs broken tool-call arguments into JSON."
repository = "https://github.com/argmend/argmend"
keywords = ["json", "llm", "tool-call"]
categories = ["encoding"]
readme = "README.md"

[dependencies]
serde_json = "1"
thiserror = "2"

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
