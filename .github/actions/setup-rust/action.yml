name: Setup Rust
description: Install a Rust toolchain and cache the build.

inputs:
  toolchain:
    description: Rust toolchain version, for example 1.95 or nightly.
    default: "1.95"
  components:
    description: Comma-separated rustup components.
    default: ""
  workspace:
    description: Cargo workspace for rust-cache, relative to the runner workspace.
    default: "."

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}
    - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      with:
        workspaces: ${{ inputs.workspace }}
        save-if: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch' || github.event_name == 'merge_group' }}
