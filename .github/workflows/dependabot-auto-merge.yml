name: Dependabot auto-merge

# This job does not check out the pull request. It only approves Dependabot.
on: # zizmor: ignore[dangerous-triggers]
  pull_request_target:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2
        with:
          egress-policy: audit
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect a SHA pin labeled as a major
        id: sha-pin
        env:
          PREV: ${{ steps.metadata.outputs.previous-version }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          sha=false
          if [ -n "${DEPS}" ] && [ "${DEPS}" != "null" ]; then
            if printf '%s' "$DEPS" | jq -e '
              type == "array" and length > 0 and
              all(.[]; (.prevVersion // "") | test("^[0-9a-f]{40}$"))
            ' >/dev/null; then
              sha=true
            fi
          elif printf '%s' "$PREV" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=true
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Approve
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.sha-pin.outputs.sha == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr review --approve "$PR_URL"
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.sha-pin.outputs.sha == 'true'
        id: app-token
        with:
          client-id: ${{ vars.AUTO_APPROVE_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_APPROVE_PRIVATE_KEY }}
      - name: Enable auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.sha-pin.outputs.sha == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge --auto --squash "$PR_URL" \
            || echo "Could not enable auto-merge. The pull request was approved."

      - name: Skip a real major update
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          steps.sha-pin.outputs.sha != 'true'
        run: echo "Skipping a major version update."
