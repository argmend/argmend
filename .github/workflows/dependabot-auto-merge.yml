name: Dependabot auto-merge

on:
  pull_request_target:

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect a SHA pin labeled as a major
        id: sha-pin
        env:
          PREV: ${{ steps.metadata.outputs.previous-version }}
          DEPS: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail
          sha=false
          if [ -n "${DEPS}" ] && [ "${DEPS}" != "null" ]; then
            if printf '%s' "$DEPS" | jq -e '
              type == "array" and length > 0 and
              all(.[]; (.prevVersion // "") | test("^[0-9a-f]{40}$"))
            ' >/dev/null; then
              sha=true
            fi
          elif printf '%s' "$PREV" | grep -Eq '^[0-9a-f]{40}$'; then
            sha=true
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - name: Approve and enable auto-merge
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' ||
          steps.sha-pin.outputs.sha == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"

      - name: Skip a real major update
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          steps.sha-pin.outputs.sha != 'true'
        run: echo "Skipping a major version update."
